<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Espécies × tempo</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #eef2f6; color: #17212b; }
    header { padding: 18px 24px; background: #17324d; color: white; }
    header h1 { margin: 0 0 5px; font-size: 1.35rem; }
    header p { margin: 0; opacity: .82; }
    main { max-width: 1200px; margin: 20px auto; padding: 0 18px; }
    .controles { display: flex; flex-wrap: wrap; gap: 12px; align-items: end;
                  padding: 16px; background: white; border-radius: 10px;
                  box-shadow: 0 2px 10px #0001; }
    label { display: grid; gap: 5px; font-weight: 650; }
    select, button { min-width: 125px; padding: 8px 10px; border: 1px solid #b8c2cc;
                      border-radius: 6px; background: white; font-size: 1rem; }
    button { cursor: pointer; min-width: auto; }
    button:hover { background: #e7eef5; }
    .galeria { display: grid; grid-template-columns: repeat(auto-fit, minmax(460px, 1fr));
                gap: 16px; margin-top: 16px; }
    .figura { padding: 14px; background: white; border-radius: 10px;
               box-shadow: 0 2px 10px #0001; text-align: center; }
    .figura h2 { margin: 2px 0 12px; font-size: 1.05rem; }
    .figura img { display: block; width: 100%; height: auto; margin: auto; }
    .acoes { display: flex; justify-content: center; gap: 14px; align-items: center;
              margin-top: 10px; }
    .acoes a { color: #135b96; }
    .vazio { grid-column: 1 / -1; padding: 35px; text-align: center;
              color: #607080; background: white; border-radius: 10px; }
    @media (max-width: 520px) { .galeria { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <h1>Galeria — Espécies × tempo</h1>
    <p>Selecione W, H e rP para visualizar um dos gráficos salvos.</p>
  </header>
  <main>
    <section class="controles">
      <label>Variabilidade
        <select id="variabilidade">
          <option value="todas">Todas</option>
          <option value="alta">Somente alta variabilidade</option>
        </select>
      </label>
      <label>W <select id="w"></select></label>
      <label>H <select id="h"></select></label>
      <label>rP <select id="rp"></select></label>
      <label>Tipo <select id="tipo"></select></label>
      <button id="anterior" type="button">← rP anterior</button>
      <button id="proximo" type="button">rP seguinte →</button>
      <button id="adicionar" type="button">+ Adicionar gráfico</button>
      <button id="limpar" type="button">Limpar comparação</button>
    </section>
    <section id="galeria" class="galeria"></section>
  </main>

.5_ciclo-1.png"}, {"w": "5", "h": "0.99", "rp": "0.5", "tipo": "Ciclo 2 (alta pelo GMM)", "variabilidade": "alta", "arquivo": "W5/H0.99/especies_tempo_rP=0.5_ciclo-2.png"}, {"w": "5", "h": "0.99", "rp": "0.5", "tipo": "Ciclo 3 (alta pelo GMM)", "variabilidade": "alta", "arquivo": "W5/H0.99/especies_tempo_rP=0.5_ciclo-3.png"}, {"w": "5", "h": "0.99", "rp": "0.5", "tipo": "Ciclo 4 (alta pelo GMM)", "variabilidade": "alta", "arquivo": "W5/H0.99/especies_tempo_rP=0.5_ciclo-4.png"}, {"w": "5", "h": "0.99", "rp": "0.5", "tipo": "Ciclo 5 (alta pelo GMM)", "variabilidade": "alta", "arquivo": "W5/H0.99/especies_tempo_rP=0.5_ciclo-5.png"}];
    catalogo.forEach(x => {
      x.tipo ??= 'Média ± desvio';
      x.variabilidade ??= x.tipo.includes('alta variabilidade') ? 'alta' : 'não_classificada';
    });
    const seletores = { w: document.querySelector('#w'), h: document.querySelector('#h'),
                         rp: document.querySelector('#rp'), tipo: document.querySelector('#tipo'),
                         variabilidade: document.querySelector('#variabilidade') };
    const itensFiltrados = () => seletores.variabilidade.value === 'alta'
      ? catalogo.filter(x => x.variabilidade === 'alta') : catalogo;
    const unicos = valores => [...new Set(valores)];
    const ordenarNumero = valores => valores.sort((a, b) => Number(a) - Number(b));
    const preencher = (select, valores, preservar) => {
      select.replaceChildren(...valores.map(valor => {
        const opcao = new Option(valor, valor);
        return opcao;
      }));
      if (valores.includes(preservar)) select.value = preservar;
    };
    function atualizarW() {
      const itens = itensFiltrados();
      preencher(seletores.w, ordenarNumero(unicos(itens.map(x => x.w))), seletores.w.value);
      atualizarH();
    }
    function atualizarH() {
      const itens = itensFiltrados().filter(x => x.w === seletores.w.value);
      preencher(seletores.h, ordenarNumero(unicos(itens.map(x => x.h))), seletores.h.value);
      atualizarRp();
    }
    function atualizarRp() {
      const itens = itensFiltrados().filter(x => x.w === seletores.w.value && x.h === seletores.h.value);
      preencher(seletores.rp, ordenarNumero(unicos(itens.map(x => x.rp))), seletores.rp.value);
      atualizarTipo();
    }
    function atualizarTipo() {
      const itens = itensFiltrados().filter(x => x.w === seletores.w.value &&
                                         x.h === seletores.h.value &&
                                         x.rp === seletores.rp.value);
      preencher(seletores.tipo, unicos(itens.map(x => x.tipo)), seletores.tipo.value);
    }
    function itemSelecionado() {
      return itensFiltrados().find(x => x.w === seletores.w.value &&
                                x.h === seletores.h.value &&
                                x.rp === seletores.rp.value &&
                                x.tipo === seletores.tipo.value);
    }
    function atualizarMensagemVazia() {
      const galeria = document.querySelector('#galeria');
      if (!galeria.querySelector('.figura')) {
        galeria.innerHTML = '<div class="vazio">Selecione uma configuração e clique em “Adicionar gráfico”.</div>';
      } else {
        galeria.querySelector('.vazio')?.remove();
      }
    }
    function adicionar() {
      const item = itemSelecionado();
      if (!item) return;
      const galeria = document.querySelector('#galeria');
      galeria.querySelector('.vazio')?.remove();
      if (galeria.querySelector(`[data-arquivo="${item.arquivo}"]`)) return;

      const cartao = document.createElement('article');
      cartao.className = 'figura';
      cartao.dataset.arquivo = item.arquivo;
      const titulo = document.createElement('h2');
      titulo.textContent = `W${item.w} — H=${item.h} — rP=${item.rp} — ${item.tipo}`;
      const imagem = document.createElement('img');
      imagem.src = item.arquivo;
      imagem.alt = titulo.textContent;
      imagem.loading = 'lazy';
      const acoes = document.createElement('div');
      acoes.className = 'acoes';
      const baixar = document.createElement('a');
      baixar.href = item.arquivo;
      baixar.download = '';
      baixar.textContent = 'Baixar PNG';
      const remover = document.createElement('button');
      remover.type = 'button';
      remover.textContent = 'Remover';
      remover.addEventListener('click', () => { cartao.remove(); atualizarMensagemVazia(); });
      acoes.append(baixar, remover);
      cartao.append(titulo, imagem, acoes);
      galeria.append(cartao);
    }
    function moverRp(delta) {
      const proximo = Math.max(0, Math.min(seletores.rp.options.length - 1,
                                           seletores.rp.selectedIndex + delta));
      seletores.rp.selectedIndex = proximo;
      atualizarTipo();
    }
    seletores.w.addEventListener('change', atualizarH);
    seletores.variabilidade.addEventListener('change', atualizarW);
    seletores.h.addEventListener('change', atualizarRp);
    seletores.rp.addEventListener('change', atualizarTipo);
    document.querySelector('#anterior').addEventListener('click', () => moverRp(-1));
    document.querySelector('#proximo').addEventListener('click', () => moverRp(1));
    document.querySelector('#adicionar').addEventListener('click', adicionar);
    document.querySelector('#limpar').addEventListener('click', () => {
      document.querySelector('#galeria').replaceChildren();
      atualizarMensagemVazia();
    });
    atualizarW();
    atualizarMensagemVazia();
  </script>
